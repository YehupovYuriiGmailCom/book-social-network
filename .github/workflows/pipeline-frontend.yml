name: BSN Frontend Pipeline

on:
  push:
    branches:
      - main
    paths:
      - book-network-ui/**
      - docker/frontend/**
      - docker-compose.yml
      - .github/workflows/pipeline-frontend.yml

jobs:
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract project version
        id: extract_version
        run: |
          cd book-network-ui
          echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: book-network-ui
          file: docker/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bsn-ui:${{ steps.extract_version.outputs.VERSION }},${{ secrets.DOCKERHUB_USERNAME }}/bsn-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [build-image]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Copy Docker Compose file to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.yml
          target: /opt/book-social-network

      - name: Deploy and verify Frontend on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /opt/book-social-network
            cat > .env <<'EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            EOF
            docker compose --env-file .env pull bsn-ui
            docker compose --env-file .env up -d bsn-ui
            for attempt in $(seq 1 18); do
              if curl --fail --silent http://localhost:8081 > /dev/null; then
                exit 0
              fi
              sleep 5
            done
            docker compose --env-file .env logs --tail=100 bsn-ui
            exit 1

      - name: Verify public Frontend availability
        run: |
          curl --fail --show-error --silent \
            --retry 12 --retry-connrefused --retry-delay 5 \
            "http://${{ secrets.VPS_HOST }}" > /dev/null