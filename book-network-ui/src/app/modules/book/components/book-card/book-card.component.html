<div class="card border-0 shadow-sm overflow-hidden" style="width: 18rem; border-radius: 12px;">
  <div class="bg-light">
    <img
      [src]="bookCover"  class="w-100 h-100"
      [alt]="book.title || 'Book cover'"
      style="object-fit: cover; object-position: top center;"
    />
  </div>

  <div class="card-body p-3">
    <div class="d-flex align-items-start gap-2 mb-1">
      <i class="fa-solid fa-book text-dark mt-1"></i>
      <h5 class="card-title fw-bold mb-0 lh-sm" style="font-size: 1rem;">{{ book.title }}</h5>
    </div>

    <div class="d-flex align-items-start gap-2 text-secondary mb-1">
      <i class="fa-solid fa-user-check mt-1"></i>
      <span class="lh-sm" style="font-size: 0.9rem; word-break: break-word;">
        {{ book.authorName }}
      </span>
    </div>

    <div class="d-flex align-items-start gap-2 text-secondary mb-1">
      <i class="fas fa-code mt-1"></i>
      <span class="lh-sm" style="font-size: 0.85rem; word-break: break-word;">
        {{ book.isbn }}
      </span>
    </div>

    <div class="d-flex align-items-start gap-2 text-secondary mb-2">
      <i class="fas fa-user mt-1"></i>
      <span class="lh-sm" style="font-size: 0.85rem;">
        {{ book.owner || 'Unknown owner' }}
      </span>
    </div>

    <hr class="my-2">

    <p class="card-text text-dark mb-0" style="font-size: 0.9rem; line-height: 1.45;">
      {{ book.synopsys }}
    </p>
  </div>

  <div class="card-footer d-flex gap-2 justify-content-between align-items-center">
    <div class="d-flex gap-2">
      <app-rating [rating]="book.rate || 0"></app-rating>
      <span class="fw-bold" *ngIf="book.rate || 0 > 0"> {{book.rate}}</span>
    </div>
    <div class="d-flex gap-2" *ngIf="!manage">
      <i (click)="onShowDetails()" class="fas fa-circle-info text-primary"></i>
      <i (click)="onBorrow()" class="fas fa-list-check text-primary"></i>
      <i (click)="onAddToWaitingList()" class="fas fa-heart text-primary"></i>
    </div>

    <div class="d-flex gap-2" *ngIf="manage">
      <i (click)="onEdit()" class="fas fa-edit text-success"></i>
      <i (click)="onShare()" class="fas fa-share-nodes text-primary"></i>
      <i (click)="onArchive()" class="fas fa-archive text-danger"></i>
    </div>
  </div>
</div>
