<h3>My books list</h3>
<hr>

<div class="d-flex justify-content-end mb-3">
  <a routerLink="/books/manage" class="btn btn-outline-primary">
    <i class="fa-solid fa-plus">
      New bookd
    </i>

  </a>
</div>

<div class="d-flex justify-content-start gap-2 flex-wrap">
  <app-book-card
    [book]="book"
    [manage] = true
    (archive)="archiveBook($event)"
    (share)="shareBook($event)"
    (edit)="editBook($event)"
    *ngFor=" let book of bookResponse.content"
  >{{book.title}}</app-book-card>
</div>
<div>
  <div class="d-flex justify-content-center mt-3">
    <nav aria-label="Page navigation example">
      <ul class="pagination">
        <li class="page-item">
          <a (click)="gotoFirstPage()" class="page-link" href="javascript:void(0)"
             aria-label="Previous"
             [class.disabled]="page == 0"
          >
            <i class="fa-solid fa-angles-left"></i>
          </a>
        </li>
        <li class="page-item">
          <a (click)="gotoPreviousPage()"
             [class.disabled]="page == 0"
             class="page-link" href="javascript:void(0)"
             aria-label="Previous">
            <i class="fa-solid fa-angle-left"></i>
          </a>
        </li>

        <li class="page-item"
            *ngFor="let _ of [].constructor(this.bookResponse.totalPages); let pageIndex= index">
          <a (click)="gotoPage(pageIndex)"
             class="page-link" href="javascript:void(0)"
             aria-label="Previous"
             [class.active]="page == pageIndex">
            <i class="fa-solid">
              {{pageIndex + 1}}
            </i>
          </a>
        </li>

        <li class="page-item">
          <a (click)="gotoNextPage()"
             [class.disabled]="isLastPage"
             class="page-link" href="javascript:void(0)"
             aria-label="Next">
            <i class="fa-solid fa-chevron-right"></i>
          </a>
        </li>
        <li class="page-item">
          <a (click)="gotoLastPage()"
             [class.disabled]="isLastPage"
             class="page-link" href="javascript:void(0)"
             aria-label="Previous">
            <i class="fa-solid fa-angles-right"></i>
          </a>
        </li>

      </ul>
    </nav>
  </div>

</div>
