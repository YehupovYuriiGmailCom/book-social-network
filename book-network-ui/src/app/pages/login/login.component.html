<div class="container-fluid cart login-container">
  <h3 class="text-center">Login</h3>
  <hr>
  <div class="alert alert-danger" role="alert" *ngIf="errorMsg.length">
    <p *ngFor="let msg of errorMsg">{{ msg }}</p>
  </div>
  <div class="mb-3">
    <label for="login" class="form-label"> Email address</label>
    <input [(ngModel)]="authResuest.email" type="email" class="form-control" id="login" placeholder="name@example.com">
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input [(ngModel)]="authResuest.password" type="password" class="form-control" id="password" placeholder="password">
  </div>

  <div class="d-flex justify-content-between">
    <button (click)="login()" type="button" class="btn btn-link">
      <em class="fas fa-sign-in-alt">&nbsp;Sign-in</em>
    </button>
    <div>
      Don't have an account?&nbsp;
      <button (click)="register()" type="button" class="btn btn-link">
        Register
      </button>
    </div>
  </div>
</div>
